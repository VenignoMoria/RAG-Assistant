[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "support-copilot-rag"
version = "0.1.0"
description = "Учебная система черновиков ответов туристической поддержки"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "structlog>=25,<26",
  "langchain-core>=0.3,<2", "langchain-text-splitters>=0.3,<2",
  "elasticsearch[async]>=8.17,<9", "redis>=5.2,<7", "aiokafka>=0.12,<1",
  "prometheus-client>=0.21,<1", "PyYAML>=6,<7"
]

[project.optional-dependencies]
models = ["torch>=2.6,<3", "transformers>=4.51,<5", "sentencepiece>=0.2", "numpy>=1.26,<3"]
training = ["torch>=2.6,<3", "transformers>=4.51,<5", "peft>=0.15,<1", "trl==0.26.0", "bitsandbytes>=0.45,<1", "datasets>=3,<5", "accelerate>=1.3,<2", "mlflow>=2.20,<4"]
onnx = ["optimum-onnx[onnxruntime]>=0.0.3,<1", "transformers>=4.51,<5", "torch>=2.6,<3", "sentencepiece>=0.2", "numpy>=1.26,<3"]
evaluation = ["ragas==0.2.15", "langchain-openai>=0.3,<0.4", "datasets>=3,<4", "mlflow>=2.20,<4"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1", "bandit>=1.8,<2", "pip-audit>=2.8,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
