{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "nli",
    "namespace": "support-copilot"
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 3,
    "strategy": {
      "type": "RollingUpdate",
      "rollingUpdate": {
        "maxSurge": 1,
        "maxUnavailable": 0
      }
    },
    "selector": {
      "matchLabels": {
        "app": "nli"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "nli"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "nli",
            "image": "ghcr.io/your-org/support-copilot-nli:0.1.0",
            "imagePullPolicy": "IfNotPresent",
            "envFrom": [
              {
                "configMapRef": {
                  "name": "copilot-config"
                }
              },
              {
                "secretRef": {
                  "name": "copilot-secrets"
                }
              }
            ],
            "ports": [
              {
                "containerPort": 8000,
                "name": "http"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "1",
                "memory": "3Gi"
              },
              "limits": {
                "cpu": "4",
                "memory": "6Gi"
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health",
                "port": "http"
              },
              "periodSeconds": 10,
              "timeoutSeconds": 5
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health",
                "port": "http"
              },
              "periodSeconds": 30,
              "timeoutSeconds": 5,
              "failureThreshold": 5
            },
            "startupProbe": {
              "httpGet": {
                "path": "/health",
                "port": "http"
              },
              "periodSeconds": 10,
              "failureThreshold": 180
            },
            "env": [
              {
                "name": "MODEL_ID",
                "value": "MoritzLaurer/mDeBERTa-v3-base-mnli-xnli"
              },
              {
                "name": "MODEL_DEVICE",
                "value": "cpu"
              }
            ],
            "volumeMounts": [
              {
                "name": "models",
                "mountPath": "/models"
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            }
          }
        ],
        "terminationGracePeriodSeconds": 120,
        "volumes": [
          {
            "name": "models",
            "persistentVolumeClaim": {
              "claimName": "model-cache"
            }
          }
        ],
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "fsGroup": 10001
        }
      }
    }
  }
}
