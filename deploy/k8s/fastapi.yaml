{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "fastapi",
    "namespace": "support-copilot"
  },
  "spec": {
    "replicas": 2,
    "revisionHistoryLimit": 3,
    "strategy": {
      "type": "RollingUpdate",
      "rollingUpdate": {
        "maxSurge": 1,
        "maxUnavailable": 0
      }
    },
    "selector": {
      "matchLabels": {
        "app": "fastapi"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "fastapi"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "fastapi",
            "image": "ghcr.io/your-org/support-copilot-fastapi:0.1.0",
            "imagePullPolicy": "IfNotPresent",
            "envFrom": [
              {
                "configMapRef": {
                  "name": "copilot-config"
                }
              },
              {
                "secretRef": {
                  "name": "copilot-secrets"
                }
              }
            ],
            "ports": [
              {
                "containerPort": 8000,
                "name": "http"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "500m",
                "memory": "512Mi"
              },
              "limits": {
                "cpu": "2",
                "memory": "2Gi"
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": "http"
              },
              "periodSeconds": 10,
              "timeoutSeconds": 5
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": "http"
              },
              "periodSeconds": 30,
              "timeoutSeconds": 5,
              "failureThreshold": 5
            },
            "startupProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": "http"
              },
              "periodSeconds": 10,
              "failureThreshold": 180
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            }
          }
        ],
        "terminationGracePeriodSeconds": 120,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "fsGroup": 10001
        }
      }
    }
  }
}
