name: FastAPI CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: fastapi-production
  cancel-in-progress: false
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      registry_image: ${{ steps.naming.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.workflow_run.head_sha }}'}
      - id: naming
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-fastapi" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/fastapi.Dockerfile
          push: true
          tags: ${{ steps.naming.outputs.image }}:${{ github.event.workflow_run.head_sha }}
  deploy:
    needs: build
    runs-on: [self-hosted, linux, copilot-deploy]
    environment: production-backend
    steps:
      - name: Update only FastAPI
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          IMAGE: ${{ needs.build.outputs.registry_image }}@${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          umask 077
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          printf '%s' "$KUBE_CONFIG" > "$config"
          export KUBECONFIG="$config"
          kubectl -n support-copilot set image deployment/fastapi "fastapi=$IMAGE"
          kubectl -n support-copilot rollout status deployment/fastapi --timeout=300s
