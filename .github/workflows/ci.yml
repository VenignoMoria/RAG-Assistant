name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install '.[dev]'
      - run: ruff check src training evaluation tests scripts
      - run: python scripts/check_syntax.py
      - run: pytest -q
      - run: bandit -r src training evaluation -ll
      - run: pip-audit
